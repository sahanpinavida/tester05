<svg width="320" height="480" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="480" fill="#2c3e50" rx="10"/>

  <!-- Display -->
  <rect x="20" y="20" width="280" height="80" fill="#34495e" rx="5"/>
  <text x="290" y="70" font-family="Arial, sans-serif" font-size="36" fill="#ecf0f1" text-anchor="end">0</text>

  <!-- Button Grid -->
  <!-- Row 1: C, /, *, - -->
  <rect x="20" y="120" width="60" height="60" fill="#e74c3c" rx="5"/>
  <text x="50" y="158" font-family="Arial, sans-serif" font-size="24" fill="#fff" text-anchor="middle">C</text>

  <rect x="90" y="120" width="60" height="60" fill="#95a5a6" rx="5"/>
  <text x="120" y="158" font-family="Arial, sans-serif" font-size="24" fill="#fff" text-anchor="middle">/</text>

  <rect x="160" y="120" width="60" height="60" fill="#95a5a6" rx="5"/>
  <text x="190" y="158" font-family="Arial, sans-serif" font-size="24" fill="#fff" text-anchor="middle">*</text>

  <rect x="230" y="120" width="70" height="60" fill="#95a5a6" rx="5"/>
  <text x="265" y="158" font-family="Arial, sans-serif" font-size="24" fill="#fff" text-anchor="middle">-</text>

  <!-- Row 2: 7, 8, 9, + -->
  <rect x="20" y="190" width="60" height="60" fill="#ecf0f1" rx="5"/>
  <text x="50" y="228" font-family="Arial, sans-serif" font-size="24" fill="#2c3e50" text-anchor="middle">7</text>

  <rect x="90" y="190" width="60" height="60" fill="#ecf0f1" rx="5"/>
  <text x="120" y="228" font-family="Arial, sans-serif" font-size="24" fill="#2c3e50" text-anchor="middle">8</text>

  <rect x="160" y="190" width="60" height="60" fill="#ecf0f1" rx="5"/>
  <text x="190" y="228" font-family="Arial, sans-serif" font-size="24" fill="#2c3e50" text-anchor="middle">9</text>

  <rect x="230" y="190" width="70" height="130" fill="#95a5a6" rx="5"/>
  <text x="265" y="258" font-family="Arial, sans-serif" font-size="24" fill="#fff" text-anchor="middle">+</text>

  <!-- Row 3: 4, 5, 6 -->
  <rect x="20" y="260" width="60" height="60" fill="#ecf0f1" rx="5"/>
  <text x="50" y="298" font-family="Arial, sans-serif" font-size="24" fill="#2c3e50" text-anchor="middle">4</text>

  <rect x="90" y="260" width="60" height="60" fill="#ecf0f1" rx="5"/>
  <text x="120" y="298" font-family="Arial, sans-serif" font-size="24" fill="#2c3e50" text-anchor="middle">5</text>

  <rect x="160" y="260" width="60" height="60" fill="#ecf0f1" rx="5"/>
  <text x="190" y="298" font-family="Arial, sans-serif" font-size="24" fill="#2c3e50" text-anchor="middle">6</text>

  <!-- Row 4: 1, 2, 3, = -->
  <rect x="20" y="330" width="60" height="60" fill="#ecf0f1" rx="5"/>
  <text x="50" y="368" font-family="Arial, sans-serif" font-size="24" fill="#2c3e50" text-anchor="middle">1</text>

  <rect x="90" y="330" width="60" height="60" fill="#ecf0f1" rx="5"/>
  <text x="120" y="368" font-family="Arial, sans-serif" font-size="24" fill="#2c3e50" text-anchor="middle">2</text>

  <rect x="160" y="330" width="60" height="60" fill="#ecf0f1" rx="5"/>
  <text x="190" y="368" font-family="Arial, sans-serif" font-size="24" fill="#2c3e50" text-anchor="middle">3</text>

  <rect x="230" y="330" width="70" height="130" fill="#3498db" rx="5"/>
  <text x="265" y="398" font-family="Arial, sans-serif" font-size="24" fill="#fff" text-anchor="middle">=</text>

  <!-- Row 5: 0, . -->
  <rect x="20" y="400" width="130" height="60" fill="#ecf0f1" rx="5"/>
  <text x="85" y="438" font-family="Arial, sans-serif" font-size="24" fill="#2c3e50" text-anchor="middle">0</text>

  <rect x="160" y="400" width="60" height="60" fill="#ecf0f1" rx="5"/>
  <text x="190" y="438" font-family="Arial, sans-serif" font-size="24" fill="#2c3e50" text-anchor="middle">.</text>
</svg>
